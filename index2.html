
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Card-Hopper-Smith</title>

        <link rel="stylesheet" href="styles2.css">
        <script src="scripts.js" defer></script>

     
    </head>
    <body>
        
        <div class="main-container">
      
           
            <div class="hero-wrapper flex-item "> 
                    <img src="trio monochrome gold 2.png" >    
                <div class="caption">
                    <svg viewBox="20 35 420 250" xmlns="http://w3.org" style="width: 100%; height: auto;" class="curve-svg">
                        <!-- Definitions for reusable paths -->
                        <defs>
                            <path id="text-curve" d="
                            M 40 80
                            Q 200 70 
                            360 80" fill="none" />
                        </defs>

                        <text font-family="sans-serif" font-size="22" font-weight="bold" fill="#333"
                                textLength="300" lengthAdjust="spacingAndGlyphs" class="curve-svg-text">
                            <textPath href="#text-curve" startOffset="0%">
                            Card-Hopper-Smith
                            </textPath>
                        </text>
                    </svg>
                </div>                          
            </div>
            <div class="playlist-wrapper flex-item">
                <!-- <div class="sub-header">
                    Recordings
                </div> -->
                <table id="playList"></table>           
            </div>
            <div class="players-wrapper flex-item">
                <div>   
                    <span class="instrument">Bass:</span>
                    <span class="player">Matt Hopper</span>
                </div>
                <div>
                    <span class="instrument">Drums:</span>
                    <span class="player">Mark Smith</span>
                </div>
                <div>
                    <span class="instrument">Keyboards:</span>
                    <span class="player">Dave Card</span>
                </div>
            </div>                  
            <div class="description-wrapper flex-itemr">
                <div class="description1">
                    <div class="description-text">
                    A jazz-oriented trio playing together for over 20 years.   
                    </div>
                
                </div>
                <div class="description2">
                    <div class="description-text">
                    Focused on mostly jazz standards in an interactive improvisational format with 
                    many styles including swing, Latin, and contemporary. 
                    </div>
                
                </div>
            </div>         
       
      
          
        </div>
      

        </body>
     
</html>
