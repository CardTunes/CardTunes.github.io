
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Card-Hopper-Smith</title>

        <link rel="stylesheet" href="styles2.css">
        <script src="scripts.js" defer></script>

     
    </head>
    <body>
        <div class="header">

        </div>
        <div class="main-container">
            <div class="top-row">
                <div class="hero-wrapper "> 
                    <img class="hero" src="trio monochrome gold 2.png" >    
                    <img class="caption" src="cardhoppersmith curve white.png" >  
                    
                </div>            
                
                <div class="playlist-wrapper ">
                    <table id="playList"></table>           
                </div>
                </div>
           
            <div class="bottom-row ">          
                <div class="players-wrapper" >
                    <div class="players-abs">
                        <div>   
                            <span class="instrument">Bass:</span>
                            <span class="player">Matt Hopper</span>
                        </div>
                        <div>
                            <span class="instrument">Drums:</span>
                            <span class="player">Mark Smith</span>
                        </div>
                        <div>
                            <span class="instrument">Keyboards:</span>
                            <span class="player">Dave Card</span>
                        </div>
                    </div>
                 
                </div>  
                <div class="description-wrapper">
                    <div class="description-abs">
                        <div class="description1">
                                A jazz-oriented trio playing together for over 20 years.                                  
                        </div>
                        <br/>
                        <div class="description2">
                            Focused on mostly jazz standards in an interactive improvisational format with 
                            many styles including swing, Latin, and contemporary.                                     
                        </div>
                    </div>

                </div>
                
            </div>

        </div>
                     
    </body>
     
</html>
